<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshRoots Cooperative</title>
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- Language bar: all five languages always visible (usability problem P4) -->
    <div class="lang-bar" id="lang-bar" role="group" aria-label="Language"></div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/home">
          <img src="img/logo.png" alt="" />
          <span class="brand-text">
            <strong>FreshRoots</strong>
            <small data-i18n="slogan">Know Your Farmer, Love Your Food</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main">
          <a href="#/home" data-route="home" data-i18n="nav_home">Home</a>
          <a href="#/browse" data-route="browse" data-i18n="nav_browse">Browse Products</a>
          <a href="#/map" data-route="map" data-i18n="nav_map">Farms &amp; Map</a>
        </nav>

        <div class="header-actions">
          <div id="account-slot"></div>
          <a href="#/cart" class="cart-link" data-route="cart">
            <span aria-hidden="true">🛒</span>
            <span data-i18n="nav_cart">Cart</span>
            <span class="cart-badge" id="cart-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="site-footer">
      <p data-i18n="footer_note">FreshRoots Cooperative — course prototype</p>
      <p><span data-i18n="footer_dev">Developed by</span> Zhang Yiwen, Chien Ching Wen, Huong Huong Nguyen</p>
    </footer>

    <div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>
    <div class="modal-backdrop" id="modal" hidden></div>

    <script src="i18n.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
